# The continuous integration.
# On every push and every pull request the tool is built and its unit tests run on Linux, macOS and Windows; every job
# runs the container-free commands on the committed corpus; only the Linux job runs `ltk check corpus/`, whose round
# trip runs the Rust XDR tool in the quickstart container with the Docker the hosted Linux runner provides. The macOS
# and Windows jobs install and start no container engine, and no job builds a Windows image. The integration tier never
# runs here.
name: ci

on:
  push:
  pull_request:

# The token may only read the repository: no job writes to it.
permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners default to autocrlf=true, which would give the README, corpus/ and schemas/ CRLF line endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./...
      - name: Container-free commands
        shell: bash
        run: |
          BIN="$RUNNER_TEMP/ltk${{ runner.os == 'Windows' && '.exe' || '' }}"
          go build -o "$BIN" ./cmd/ltk
          "$BIN" list corpus/
          "$BIN" list corpus/ --json
          "$BIN" compare corpus/ corpus/
          "$BIN" compare testdata/compare/ledger-only/a testdata/compare/ledger-only/b
          if "$BIN" compare testdata/compare/reproduced-changed/a testdata/compare/reproduced-changed/b; then exit 1; fi
      - name: ltk check corpus/ (Linux only)
        if: runner.os == 'Linux'
        run: go build -o "$RUNNER_TEMP/ltk" ./cmd/ltk && "$RUNNER_TEMP/ltk" check corpus/

  ci-green:
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every system passed
        run: test "${{ needs.build-and-test.result }}" = success
